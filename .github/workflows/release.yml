name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/test.yml

  release-context:
    name: Identify merged release PR
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.context.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the exact commit and its merged PR
        id: context
        run: node scripts/release-context.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz:
    name: Publish Rust crates
    needs: release-context
    if: needs.release-context.outputs.release == 'true'
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download Sparkle framework
        run: bash scripts/download-sparkle.sh "$GITHUB_WORKSPACE"

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # release-plz 0.3.164+ runs cargo-semver-checks on a temporary copy
          # of the crate, so build.rs cannot find the framework downloaded
          # into the workspace unless told where it is.
          SPARKLE_FRAMEWORK_PATH: ${{ github.workspace }}

  release-pr:
    name: Prepare release PR
    needs: release-context
    if: needs.release-context.outputs.release == 'false'
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write
    # Only PR updates can be superseded; never discard a queued crate release.
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Download Sparkle framework
        run: bash scripts/download-sparkle.sh "$GITHUB_WORKSPACE"
      - name: Prepare release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_FRAMEWORK_PATH: ${{ github.workspace }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release-context, release-plz]
    # Use commit eligibility, not releases_created, so npm can retry after Rust succeeds.
    if: needs.release-context.outputs.release == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whether the npm version is published
        id: npm-version
        run: node scripts/check-npm-release.mjs

      - name: Build
        if: steps.npm-version.outputs.publish == 'true'
        run: pnpm build

      - name: Publish to npm
        if: steps.npm-version.outputs.publish == 'true'
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
